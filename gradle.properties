# 本机总内存 15.4GB，编译期 Gradle daemon + Kotlin daemon 各拿 3GB 会把内存吃满，
# 表现为 compileDebugKotlin 阶段进程被系统直接杀掉（无编译错误、无 EXIT）。故下调上限。
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true
# KSP2 与 AGP 9 内置 Kotlin 配合（与本机已验证工程保持一致）
ksp.useKSP2=true
# Kotlin 编译 daemon 单独限内存（默认会跟着 Gradle 的 -Xmx 一起涨）
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
